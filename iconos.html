<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Windows XP</title>
    <link rel="stylesheet" href="iconos_miniOs.css" />
  </head>
  <body>
    <div id="desktop">
      <div class="desktop-icon" onclick="abrirPapelera()">
        <img src="icono_papelera.webp" alt="Papelera de reciclaje" class="app-icon-img"/>
        <span class="icon-label">Papelera de reciclaje</span>
      </div>
    </div>

    <div id="papelera-window" class="window-xp hidden"> 

        <div class="title-bar"> 
            <span class="title-text">Papelera de reciclaje</span> 
            <div class="window-controls"> 
                <button class="control-button minimize" onclick="minimizarPapelera()">-</button> 
                <button class="control-button maximaze" onclick="maximizarPapelera()"> 
                    <span id="maximize-icon">[]</span>
                </button> 
                <button class="control-button close" onclick="cerrarPapelera()">X</button>
            </div>
        </div> 

        <div class="window-content"> 
            <h2>El contenido de la papelera iría aquí.</h2> 
            <p>Simulación de archivos eliminados...</p>
        </div>
    </div>
    <div id="taskbar"></div> 

    <script> 
        function abrirPapelera() { 
            const window = document.getElementById('papelera-window'); 
            const taskIcon = document.getElementById('papelera-task-icon'); 

            window.classList.remove('hidden'); // Mostrar ventana 
            taskIcon.classList.remove('hidden'); // Mostrar ícono en la barra de tareas
        } 

        function cerrarPapelera() { 
            const window = document.getElementById('papelera-window'); 
            const taskIcon = document.getElementById('papelera-task-icon'); 

            window.classList.add('hidden'); // Ocultar ventana 
            taskIcon.classList.add('hidden'); // Ocultar ícono de la barra de tareas
        } 

        function minimizarPapelera() { 
            document.getElementById('papelera-window').classList.add('hidden');
        } 

        function restaurarPapelera() { 
            document.getElementById('papelera-window').classList.remove('hidden');
        }
    </script>
  </body>
</html>
